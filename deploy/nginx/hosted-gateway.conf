# Template for a privately tested gateway. Supply your certificate files and
# replace the example auth origin before enabling this configuration.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=api_peer:1m rate=30r/m;
  limit_req_zone $server_name zone=api_total:1m rate=120r/m;
  limit_conn_zone $binary_remote_addr zone=peer_connections:1m;
  limit_req_status 429;
  limit_conn_status 429;
  client_max_body_size 8k;
  client_body_timeout 5s;
  client_header_timeout 5s;
  keepalive_timeout 10s;
  send_timeout 5s;

  server {
    listen 8443 ssl;
    server_name repobrain.example.invalid;
    ssl_certificate /run/tls/cert.pem;
    ssl_certificate_key /run/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://project.example.invalid; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    error_page 429 = @throttled;
    location @throttled {
      add_header Retry-After 5 always;
      add_header Cache-Control no-store always;
      default_type application/json;
      return 429 '{"error":{"code":"gateway_limit","message":"Service busy. Try again shortly."}}';
    }
    location /api/ {
      limit_req zone=api_peer burst=8 nodelay;
      limit_req zone=api_total burst=16 nodelay;
      limit_conn peer_connections 4;
      proxy_request_buffering on;
      proxy_connect_timeout 3s;
      proxy_read_timeout 85s;
      proxy_send_timeout 10s;
      proxy_next_upstream off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      set $backend http://backend:8000;
      proxy_pass $backend$request_uri;
    }
    location / {
      proxy_hide_header Content-Security-Policy;
      proxy_set_header Host $host;
      set $frontend http://frontend:8080;
      proxy_pass $frontend$request_uri;
    }
  }
}
