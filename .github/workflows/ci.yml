name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.10"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -m "not postgres"
      - name: PostgreSQL integration tests
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Non-root graph runtime smoke test
        run: docker compose -p repobrain-graph-runtime -f compose.test.yaml run --build --rm runtime-graph-smoke
      - name: Stop integration services
        if: always()
        run: |
          docker compose -f compose.test.yaml down
          docker compose -p repobrain-graph-runtime -f compose.test.yaml down
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Build hosted static frontend with offline fixture settings
        working-directory: frontend
        env:
          VITE_DEPLOYMENT_MODE: hosted
          VITE_API_BASE_URL: https://api.example.invalid
          VITE_SUPABASE_URL: https://auth.example.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
        run: npm run build:hosted
      - name: Start disposable end-to-end stack
        run: docker compose -p repobrain-browser-smoke -f compose.test.yaml -f compose.frontend-test.yaml up --build -d --wait frontend
      - name: Verify private Compose boundaries
        env:
          POSTGRES_PASSWORD: ci-fixture-password
          REPOBRAIN_GENERATION_ENDPOINT: https://example.invalid
          REPOBRAIN_GENERATION_MODEL: ci-fixture
          REPOBRAIN_GENERATION_API_KEY: ci-fixture-key
        run: |
          docker compose -f compose.yaml -f compose.frontend.yaml -f compose.private.yaml config --format json |
            jq -e '
              .services as $services |
              (($services.backend.ports // []) | length == 0) and
              (($services.db.ports // []) | length == 0) and
              ($services.frontend.ports | length == 1 and .[0].host_ip == "127.0.0.1") and
              ($services.backend.environment |
                has("REPOBRAIN_GENERATION_ENDPOINT") == false and
                has("REPOBRAIN_GENERATION_MODEL") == false and
                has("REPOBRAIN_GENERATION_API_KEY") == false)
            '
      - name: Test production frontend and real backend
        working-directory: frontend
        env:
          REPOBRAIN_E2E_BASE: http://127.0.0.1:4180
          REPOBRAIN_SCREENSHOTS: test-results/screenshots
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-results
          path: frontend/test-results
      - name: Stop disposable end-to-end stack
        if: always()
        run: docker compose -p repobrain-browser-smoke -f compose.test.yaml -f compose.frontend-test.yaml down
