services:
  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REPOBRAIN_HOST_PORT:-8000}:8000"
    environment:
      REPOBRAIN_LOG_LEVEL: ${REPOBRAIN_LOG_LEVEL:-INFO}
      REPOBRAIN_LOCAL_DB_PASSWORD: &local-db-password ${POSTGRES_PASSWORD:-repobrain-local-only}
      REPOBRAIN_DB_POOL_SIZE: ${REPOBRAIN_DB_POOL_SIZE:-5}
      REPOBRAIN_DB_MAX_OVERFLOW: ${REPOBRAIN_DB_MAX_OVERFLOW:-5}
      REPOBRAIN_DB_POOL_TIMEOUT: ${REPOBRAIN_DB_POOL_TIMEOUT:-10}
      REPOBRAIN_INGESTION_MAX_FILES: ${REPOBRAIN_INGESTION_MAX_FILES:-200}
      REPOBRAIN_INGESTION_MAX_FILE_BYTES: ${REPOBRAIN_INGESTION_MAX_FILE_BYTES:-262144}
      REPOBRAIN_INGESTION_MAX_TOTAL_BYTES: ${REPOBRAIN_INGESTION_MAX_TOTAL_BYTES:-4194304}
      REPOBRAIN_INGESTION_MAX_NETWORK_BYTES: ${REPOBRAIN_INGESTION_MAX_NETWORK_BYTES:-12582912}
      REPOBRAIN_INGESTION_TIMEOUT: ${REPOBRAIN_INGESTION_TIMEOUT:-60}
      REPOBRAIN_INGESTION_CONCURRENCY: ${REPOBRAIN_INGESTION_CONCURRENCY:-1}
      REPOBRAIN_GENERATION_ENDPOINT:
      REPOBRAIN_GENERATION_MODEL:
      REPOBRAIN_GENERATION_API_KEY:
      REPOBRAIN_GENERATION_TIMEOUT: ${REPOBRAIN_GENERATION_TIMEOUT:-30}
      REPOBRAIN_GENERATION_CONCURRENCY: ${REPOBRAIN_GENERATION_CONCURRENCY:-2}
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_DB: repobrain
      POSTGRES_USER: repobrain
      POSTGRES_PASSWORD: *local-db-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" psql -h "$$HOSTNAME"
          -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -w -Atqc 'SELECT 1' >/dev/null
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
