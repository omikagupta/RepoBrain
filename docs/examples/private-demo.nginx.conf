# Example read-only demo gateway. Run without the ordinary frontend listener.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 8k;
  client_header_timeout 5s;
  client_body_timeout 5s;
  send_timeout 10s;
  keepalive_timeout 10s;
  limit_req_zone $binary_remote_addr zone=demo_api:1m rate=120r/m;
  limit_conn_zone $binary_remote_addr zone=demo_peer:1m;
  limit_req_status 429;
  limit_conn_status 429;

  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /run/demo/cert.pem;
    ssl_certificate_key /run/demo/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Private RepoBrain demo";
    auth_basic_user_file /run/demo/users;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location ~ "^/api/v1/(ingestions/[0-9a-fA-F-]{36}|snapshots/[0-9a-fA-F-]{36}/(readiness|graph|nodes|edges|neighborhood|source|search/(lexical|vector|hybrid|graph-enhanced)))$" {
      limit_req zone=demo_api burst=24 nodelay;
      limit_conn demo_peer 6;
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header Host backend;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_next_upstream off;
      proxy_pass $backend$uri$is_args$args;
    }
    location /api/ { deny all; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
