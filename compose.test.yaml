name: repobrain-db-tests

services:
  tests:
    build:
      context: .
      target: test
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      REPOBRAIN_TEST_DATABASE_URL: postgresql+asyncpg://repobrain_test:repobrain-test-only@test-db:5432/repobrain_test
  runtime-graph-smoke:
    profiles: [runtime-smoke]
    build:
      context: .
      target: runtime
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      REPOBRAIN_DATABASE_URL: postgresql+asyncpg://repobrain_test:repobrain-test-only@test-db:5432/repobrain_test
    volumes:
      - ./tests/runtime_graph_smoke.py:/app/runtime_graph_smoke.py:ro
    command: ["python", "/app/runtime_graph_smoke.py"]
  test-db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: repobrain_test
      POSTGRES_USER: repobrain_test
      POSTGRES_PASSWORD: repobrain-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
